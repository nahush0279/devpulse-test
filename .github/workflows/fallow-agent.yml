name: Fallow AI Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fallow-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so fallow can diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      # ════════════════════════════════════════════════════════════════
      # BLOCKING CHECKS — fail the PR if any of these are introduced
      # ════════════════════════════════════════════════════════════════

      # 1. console.log + unused imports on CHANGED files only.
      #    console-hits.tsv -> agent posts one inline comment per hit.
      #    eslint-report.json -> agent posts inline comments for unused imports.
      - name: Detect console statements & unused imports (changed files)
        run: |
          git fetch origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"

          git diff "$BASE" HEAD --unified=0 -- '*.js' '*.jsx' '*.ts' '*.tsx' \
          | awk '
            /^\+\+\+ b\// { file = substr($0, 7); next }
            /^@@/ {
              match($0, /\+[0-9]+/); ln = substr($0, RSTART+1, RLENGTH-1) + 0; next
            }
            /^\+/ && !/^\+\+\+/ {
              if ($0 ~ /console\.(log|debug|info|warn|error)\(/ && $0 !~ /eslint-disable/ && $0 !~ /fallow-ignore/) {
                printf("%s\t%d\n", file, ln);
              }
              ln++;
              next
            }
          ' > console-hits.tsv || true

          if [ -s console-hits.tsv ]; then
            echo "::error::This PR adds console statements:"
            cat console-hits.tsv
            echo "CONSOLE_FAIL=true" >> "$GITHUB_ENV"
          fi

          CHANGED=$(git diff "$BASE" HEAD --name-only --diff-filter=ACMR -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if [ -n "$CHANGED" ]; then
            npx eslint --format json --output-file eslint-report.json $CHANGED \
              || echo "UNUSED_IMPORT_FAIL=true" >> "$GITHUB_ENV"
          fi

      # 2. Fallow gate — blocking findings in changed files only.
      - name: Fallow audit (gate)
        run: |
          npx fallow audit \
            --changed-since "origin/${{ github.base_ref }}" \
            --fail-on-issues

      # ════════════════════════════════════════════════════════════════
      # ADVISORY LAYER — duplication & circular deps: comment, never block
      # ════════════════════════════════════════════════════════════════

      - name: Fallow audit (JSON for agent)
        if: always()
        run: |
          npx fallow audit \
            --changed-since "origin/${{ github.base_ref }}" \
            --format json > fallow-report.json || true
          npx fallow dupes --changed-since "origin/${{ github.base_ref }}" \
            --format json > fallow-dupes.json || true

      - name: AI agent — analyze & comment on PR
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONSOLE_FAIL: ${{ env.CONSOLE_FAIL }}
          UNUSED_IMPORT_FAIL: ${{ env.UNUSED_IMPORT_FAIL }}
        run: node scripts/fallow-agent.mjs

      - name: Enforce console/import blocks
        if: env.CONSOLE_FAIL == 'true' || env.UNUSED_IMPORT_FAIL == 'true'
        run: |
          echo "Blocking issues found (console logs and/or unused imports). See the agent comments."
          exit 1
