name: Fallow AI Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fallow-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so fallow can diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # ════════════════════════════════════════════════════════════════
      # BLOCKING CHECKS — fail the PR if any of these are introduced
      # ════════════════════════════════════════════════════════════════

      # 1. console.log added by THIS PR -> write file+line JSON so the agent
      #    can post each as an inline review comment (not just a CI-log line).
      - name: Detect new console statements
        run: |
          git fetch origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"

          # Per added line, capture file + new-file line number from the diff hunks.
          git diff "$BASE" HEAD --unified=0 -- '*.js' '*.jsx' '*.ts' '*.tsx' \
          | awk '
            /^\+\+\+ b\// { file = substr($0, 7); next }
            /^@@/ {
              # @@ -a,b +c,d @@  -> new-file start line is c
              match($0, /\+[0-9]+/); ln = substr($0, RSTART+1, RLENGTH-1) + 0; next
            }
            /^\+/ && !/^\+\+\+/ {
              if ($0 ~ /console\.(log|debug|info|warn|error)\(/ && $0 !~ /eslint-disable/ && $0 !~ /fallow-ignore/) {
                printf("%s\t%d\n", file, ln);
              }
              ln++;
              next
            }
          ' > console-hits.tsv || true

          if [ -s console-hits.tsv ]; then
            echo "::error::This PR adds console statements:"
            cat console-hits.tsv
            echo "CONSOLE_FAIL=true" >> "$GITHUB_ENV"
          fi

      # 2. Unused locals/imports via TypeScript (uses your tsconfig; no extra deps,
      #    no removed ESLint flags). Only fails if tsc reports unused-symbol errors.
      - name: Check unused locals (tsc)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit --noUnusedLocals --noUnusedParameters 2>&1 | tee tsc-out.txt || true
            if grep -qE "TS6133|TS6196|TS6192" tsc-out.txt; then
              echo "::error::Unused imports/locals detected (see tsc output above)."
              echo "UNUSED_IMPORT_FAIL=true" >> "$GITHUB_ENV"
            fi
          fi

      # 2. Fallow blocking categories (unused files / exports / deps).
      #    Severity comes from .fallowrc.json: error rules fail, warn rules don't.
      #    gate: new-only -> only findings introduced by this PR can fail it.
      - name: Fallow audit (gate)
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          annotations: true
          review-comments: true
          review-guidance: true

      # ════════════════════════════════════════════════════════════════
      # ADVISORY LAYER — duplication & circular deps: comment, never block
      # ════════════════════════════════════════════════════════════════

      - name: Fallow audit (JSON for agent)
        if: always() # run even if blocking checks failed, so the comment explains why
        run: |
          npx fallow audit \
            --base "origin/${{ github.base_ref }}" \
            --format json > fallow-report.json || true
          npx fallow dupes --changed-since "origin/${{ github.base_ref }}" \
            --format json > fallow-dupes.json || true

      - name: AI agent — analyze & comment on PR
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONSOLE_FAIL: ${{ env.CONSOLE_FAIL }}
          UNUSED_IMPORT_FAIL: ${{ env.UNUSED_IMPORT_FAIL }}
        run: node scripts/fallow-agent.mjs

      # Surface the grep-based failures as a job failure at the end,
      # after the agent has had a chance to comment.
      - name: Enforce console/import blocks
        if: env.CONSOLE_FAIL == 'true' || env.UNUSED_IMPORT_FAIL == 'true'
        run: |
          echo "Blocking issues found (console logs and/or unused imports). See the agent comment."
          exit 1
